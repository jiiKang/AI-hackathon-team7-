<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>안암 카페 챗</title>
<meta name="theme-color" content="#3659c8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="안암카페">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<!-- 디자인(색·글자·간격·모양)은 styles.css, 문구·화면 구성은 app.js 에서 바꿔요 -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" data-mode="home">
  <div id="map"></div>

  <!-- 지도 위 하단 시트 (홈 · 검색 결과) -->
  <section id="sheet" aria-label="카페" data-view="home">
    <div class="hazard" id="grab" data-drag aria-hidden="true"></div>
    <div class="body" id="body"></div>
  </section>

  <!-- 전체 화면 페이지 (채팅 · 카페 상세 · 정보 수정 · 출처 · 기록) -->
  <section id="page" aria-label="상세" hidden>
    <div class="pbody" id="pbody"></div>
  </section>

  <!-- 하단 둥근 메뉴 (홈에서만) -->
  <nav id="nav" aria-label="메뉴"></nav>

  <!-- 도로 표지판 입력창: 홈에서는 위, 그 외에는 아래 -->
  <form id="sign" class="sign" autocomplete="off">
    <span class="rail" aria-hidden="true"></span>
    <div class="face">
      <div class="field">
        <input id="q" type="text" enterkeyhint="search" maxlength="120" aria-label="검색어" autocomplete="off">
        <span id="ph" class="sph"></span>
      </div>
      <button type="submit" class="tip" aria-label="보내기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
  </form>

  <div id="toast" role="status" aria-live="polite"></div>
</div>

<!-- 시작 화면: 처음엔 로고+로딩만 보이고(loading), 로그인 상태를 확인한 뒤 로그인 상태면 바로 닫히고 아니면 구글 로그인/둘러보기 버튼이 나와요 -->
<section id="welcome" class="loading" aria-label="시작">
  <div class="wbox">
    <img class="logo" src="logo.png" alt="어디로">
    <p class="tag">어디로? 이대로. ㅇㄷ로</p>
    <div class="wload" role="status" aria-label="불러오는 중"></div>
    <button class="gbtn" id="gLogin" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.2 1.1-3.8 1.1-2.9 0-5.4-2-6.2-4.6H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.3 1.7l3.2-3.2A11 11 0 0 0 2.1 7.1l3.7 2.8C6.6 7.4 9.1 5.4 12 5.4z"/></svg>
      Google로 시작하기
    </button>
    <button class="guest" id="guest" type="button">로그인 없이 들러보기</button>
    <p class="err" id="wErr"></p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
